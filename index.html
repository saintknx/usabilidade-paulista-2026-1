<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Div onde o react será renderizado-->
    <div id= "root"></div>
    
    <!-- Importando as bibliotecas do react -->
    <script src="https://unpkg.com/react@18/umd/react.development.js">

    </script>
    
    <!-- React DOM faz a ponte entre o react e o DOM do navegador -->
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">

    </script>
    
    <!-- Babel para transpilar JSX -->
    <script src= "https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src=https://unpkg.com/styled-components/dist/styled-components.min.js></script>

    <script type="text/babel">

        function ListaComDescricao(){

            const itens = [
            {id: 1, titulo: 'Primeiro', descricao: 'Descrição 1'},
            {id: 2, titulo: 'Segundo', descricao: 'Descrição 2'},
            {id: 3, titulo: 'Terceiro', descricao: 'Descrição 3'}];

            // const estilo = {color : 'red', backgroundColor : 'black', padding : '10px', borderRadius : '5px'};
        // Componente de exemplo

        // const Titulo = styled.h1`
        //     color: red;
        //     background-color: black;
        //     padding: 10px;
        //     border-radius: 5px;
        // `;

        return (
                <dl>
                    {itens.map(item => (
                        <React.Fragment key="{item.id}">
                            <dt>{item.titulo}</dt>
                            <dd>{item.descricao}</dd>
                        </React.Fragment>
                    ))}
                </dl>
            );


}
    ReactDOM.render(<ListaComDescricao />, document.getElementById('root')).render(
        <ListaComDescricao />
    );
    </script>

</body>
</html>
