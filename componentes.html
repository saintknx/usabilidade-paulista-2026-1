<!DOCTYPE html>
<html lang="pt-br">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Div onde o react será renderizado-->
    <div id= "root"></div>

    <script src="https://unpkg.com/styled-components/dist/styled-components.js"></script>
    
    <!-- Importando as bibliotecas do react -->
    <script src="https://unpkg.com/react@18/umd/react.development.js">

    </script>
    
    <!-- React DOM faz a ponte entre o react e o DOM do navegador -->
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">

    </script>
    
    <!-- Babel para transpilar JSX -->
    <script src= "https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src=https://unpkg.com/styled-components/dist/styled-components.min.js></script>

    <script type="text/babel">

        function Botao(props){
            const handleClick = () => {
                alert('Botão clicado!');
            }
            return (
                <button className="bg-blue-500 hover: bg-blue-700 text-white" classonClick={handleClick}> 
                    {props.texto} 
                    
                    
                </button>
            )
        }


    ReactDOM.createRoot(document.getElementById('root')).render
    (
    <>    
    <Botao texto = "Enviar" />;
    <Botao texto = "Cancelar" />
    </>     
    );
    


    </script>

</body>
</html>
